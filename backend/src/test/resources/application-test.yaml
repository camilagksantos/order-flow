spring:
  datasource:
    url: jdbc:tc:mysql:8.0:///orderflow
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  mail:
    from: noreply@orderflow.pt
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha
    expiration: 900000
    refresh-expiration: 604800000