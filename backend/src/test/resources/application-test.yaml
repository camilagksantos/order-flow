spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  mail:
    from: noreply@orderflow.pt
  jwt:
    secret: test-secret-key-must-be-at-least-256-bits-long-for-hmac-sha
    expiration: 900000
    refresh-expiration: 604800000

logging:
  level:
    org.flywaydb: DEBUG