spring:
  application:
    name: orderflow

  datasource:
    url: jdbc:mysql://localhost:3306/orderflow
    username: orderflow
    password: orderflow
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  mail:
    host: localhost
    port: 1025
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

app:
  mail:
    from: noreply@orderflow.pt
  jwt:
    secret: your-256-bit-secret-key-here-must-be-long-enough
    expiration: 900000
    refresh-expiration: 604800000