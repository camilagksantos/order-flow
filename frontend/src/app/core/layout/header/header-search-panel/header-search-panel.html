<div class="mx-auto max-w-2xl rounded-card border border-line bg-surface p-3 shadow-overlay" (keydown.escape)="close()">
    <div class="flex items-center gap-2">
        <input #searchInput type="text" inputmode="search" enterkeyhint="search" autocomplete="off"
            aria-label="Pesquisar produtos" placeholder="Pesquisar produtos"
            class="h-11 w-full rounded-control border border-line-strong bg-white px-3 text-base text-ink placeholder:text-ink-soft focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-wine-600"
            [value]="draft()" (input)="onInput($event)" (keydown.enter)="submit()" />
        <button type="button" aria-label="Limpar e fechar pesquisa"
            class="inline-flex size-11 shrink-0 items-center justify-center rounded-control text-ink-soft transition duration-300 ease-soft hover:bg-soft hover:text-ink focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-wine-600"
            (click)="close()">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" aria-hidden="true">
                <path d="M6 6l12 12M18 6 6 18" />
            </svg>
        </button>
    </div>
    @if (trimmedDraft()) {
    <button type="button"
        class="mt-2 flex w-full items-center gap-2 rounded-control px-3 py-2.5 text-left text-sm text-ink transition duration-300 ease-soft hover:bg-soft focus-visible:outline-2 focus-visible:outline-wine-600"
        (click)="submit()">
        <svg class="size-4 shrink-0 text-ink-soft" viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <circle cx="11" cy="11" r="6.5" />
            <path d="m16 16 4.5 4.5" />
        </svg>
        <span>Pesquisar «{{ trimmedDraft() }}»</span>
    </button>
    }
</div>
