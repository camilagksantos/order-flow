<button type="button"
    class="inline-flex size-11 items-center justify-center rounded-control text-ink transition duration-300 ease-soft hover:bg-soft focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-wine-600"
    [attr.aria-label]="open() ? 'Fechar pesquisa' : 'Pesquisar'" [attr.aria-expanded]="open()" (click)="toggled.emit()">
    <svg class="size-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
        aria-hidden="true">
        <circle cx="11" cy="11" r="6.5" />
        <path d="m16 16 4.5 4.5" />
    </svg>
</button>
